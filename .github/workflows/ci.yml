name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  speech:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/speech
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Default groups only (no heavy `ml` group).
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # Deployment image; Docker isn't installed on the dev laptops, so CI is where it gets built.
      - run: docker build -t echocv-speech .
