[project]
name = "echocv-speech"
version = "0.1.0"
description = "EchoCV speech service: VAD, filler-aware ASR, prosody and upload-mode vision"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Heavy ML stack, kept out of CI. Install with: uv sync --group ml
ml = [
    "faster-whisper>=1.2.1",
    "librosa>=1.0.0",
    "mediapipe>=1.0.1",
    "silero-vad>=6.2.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
